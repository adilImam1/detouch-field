name: Telegram notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Send notifications
        run: python3 .github/tg_relay.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
      - name: Keep the schedule alive (GitHub pauses schedules after 60 idle days)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt 4320000 ]; then
            date -u > .github/keepalive.txt
            git config user.name "detouch-relay"; git config user.email "relay@users.noreply.github.com"
            git add .github/keepalive.txt; git commit -m "keepalive"; git push
          fi
